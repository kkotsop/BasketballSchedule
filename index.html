<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.workers.dev; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">

<title>ΑΠΟΠ U14 &amp; U16 — Γ΄ Όμιλος</title>

<link rel="manifest" href="manifest.webmanifest">

<style id="css">
/* Tokens map to Tailwind: slate neutrals, orange-600 accent, blue-600 club colour.
   Glass = translucent fill + backdrop blur + 1px light edge + layered shadow (fintech card). */
:root{
  --bg-top:#EDF2F8;--bg-bot:#D8E1EC;--surface:#FFFFFF;
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.82);--edge:rgba(255,255,255,.82);--hair:rgba(15,23,42,.09);--field:rgba(255,255,255,.62);--glass-soft:rgba(255,255,255,.38);
  --line-strong:rgba(71,85,105,.38);
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --accent:#EA580C;--accent-text:#C2410C;--accent-chip:rgba(251,146,60,.24);--accent-line:rgba(234,88,12,.45);
  --next-a:rgba(255,237,213,.82);--next-b:rgba(255,255,255,.5);
  --club:#2563EB;
  --win:#047857;--win-soft:rgba(16,185,129,.18);--loss:#BE123C;--loss-soft:rgba(244,63,94,.16);
  --sh:0 1px 0 rgba(255,255,255,.75) inset,0 14px 32px -16px rgba(15,23,42,.35),0 2px 6px rgba(15,23,42,.06);
  --sh-lift:0 1px 0 rgba(255,255,255,.85) inset,0 22px 44px -16px rgba(234,88,12,.5),0 4px 12px rgba(15,23,42,.10);
  --blur:blur(18px) saturate(170%);
  --glow-a:rgba(37,99,235,.16);--glow-b:rgba(234,88,12,.12);
  --ball-filter:grayscale(1) contrast(1.12) drop-shadow(0 6px 10px rgba(15,23,42,.30));--ball-shadow:rgba(15,23,42,.5);
  --dw:46px;--rw:26px;
  box-sizing:border-box;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg-top:#0B1220;--bg-bot:#04070E;--surface:#0F172A;
  --glass:rgba(15,23,42,.55);--glass-strong:rgba(15,23,42,.84);--edge:rgba(255,255,255,.11);--hair:rgba(255,255,255,.09);--field:rgba(2,6,23,.55);--glass-soft:rgba(15,23,42,.4);
  --line-strong:rgba(148,163,184,.4);
  --text:#F1F5F9;--text-2:#A9B6CB;--text-3:#64748B;
  --accent:#F97316;--accent-text:#FDBA74;--accent-chip:rgba(249,115,22,.26);--accent-line:rgba(249,115,22,.55);
  --next-a:rgba(249,115,22,.30);--next-b:rgba(15,23,42,.62);
  --win:#34D399;--win-soft:rgba(52,211,153,.2);--loss:#FB7185;--loss-soft:rgba(251,113,133,.2);
  --sh:0 1px 0 rgba(255,255,255,.07) inset,0 16px 36px -16px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.3);
  --sh-lift:0 1px 0 rgba(255,255,255,.1) inset,0 24px 48px -16px rgba(249,115,22,.42),0 4px 12px rgba(0,0,0,.35);
  --glow-a:rgba(59,130,246,.22);--glow-b:rgba(249,115,22,.14);
  --ball-filter:grayscale(1) brightness(.72) contrast(1.1) drop-shadow(0 6px 10px rgba(0,0,0,.5));--ball-shadow:rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg-top:#0B1220;--bg-bot:#04070E;--surface:#0F172A;
  --glass:rgba(15,23,42,.55);--glass-strong:rgba(15,23,42,.84);--edge:rgba(255,255,255,.11);--hair:rgba(255,255,255,.09);--field:rgba(2,6,23,.55);--glass-soft:rgba(15,23,42,.4);
  --line-strong:rgba(148,163,184,.4);
  --text:#F1F5F9;--text-2:#A9B6CB;--text-3:#64748B;
  --accent:#F97316;--accent-text:#FDBA74;--accent-chip:rgba(249,115,22,.26);--accent-line:rgba(249,115,22,.55);
  --next-a:rgba(249,115,22,.30);--next-b:rgba(15,23,42,.62);
  --win:#34D399;--win-soft:rgba(52,211,153,.2);--loss:#FB7185;--loss-soft:rgba(251,113,133,.2);
  --sh:0 1px 0 rgba(255,255,255,.07) inset,0 16px 36px -16px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.3);
  --sh-lift:0 1px 0 rgba(255,255,255,.1) inset,0 24px 48px -16px rgba(249,115,22,.42),0 4px 12px rgba(0,0,0,.35);
  --glow-a:rgba(59,130,246,.22);--glow-b:rgba(249,115,22,.14);
  --ball-filter:grayscale(1) brightness(.72) contrast(1.1) drop-shadow(0 6px 10px rgba(0,0,0,.5));--ball-shadow:rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg-bot)}
body{
  position:fixed;inset:0;width:100%;margin:0;overflow:hidden;background:var(--bg-bot);color:var(--text);
  font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
#root{height:100%}
.app{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;z-index:1}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* glass surface, used everywhere */
.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.9);--glass-strong:rgba(255,255,255,.96)}
}

/* background: one real-looking basketball that stays put while the list scrolls */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--bs:min(118vw,88vh,840px);
  background:radial-gradient(70% 45% at 100% 0%,var(--glow-a),transparent 70%),radial-gradient(60% 40% at 0% 100%,var(--glow-b),transparent 70%),linear-gradient(180deg,var(--bg-top),var(--bg-bot))}

/* header */
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.logo{width:46px;height:46px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(15,23,42,.3))}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ttl p{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2);font-weight:500}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--text-2);transition:color .15s}
.ibtn:hover{color:var(--text)}
.ibtn svg{width:20px;height:20px}
.sw{position:relative;width:66px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--text-3)}
.sw svg{width:16px;height:16px;position:relative;z-index:1}
.sw .knob{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:999px;background:linear-gradient(180deg,#F97316,#C2410C);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 12px -4px rgba(234,88,12,.7);transition:transform .18s ease-out}
.sw[aria-checked="true"] .knob{transform:translateX(28px)}
.sw .sun{color:#fff}.sw[aria-checked="true"] .sun{color:var(--text-3)}
.sw .moon{color:var(--text-3)}.sw[aria-checked="true"] .moon{color:#fff}

/* season widget */
.widget{margin:4px 16px 10px;padding:14px 0;border-radius:20px;display:grid;grid-template-columns:.9fr 1.4fr .9fr}
.widget .cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px;min-width:0}
.widget .cell+.cell{border-left:1px solid var(--hair)}
.big{font-size:26px;line-height:26px;font-weight:700;letter-spacing:-.03em}
.cap{font-size:12px;color:var(--text-2);font-weight:500}
.form{display:flex;gap:3px;height:26px;align-items:center}
.pip{width:20px;height:20px;border-radius:999px}
.pip.w{background:#16A34A;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.pip.l{background:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.18)}
.pip.e{border:1.5px dashed var(--line-strong)}

/* timeline */
.scrollwrap{flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 0;-webkit-overflow-scrolling:touch}
.tl{position:relative;padding-bottom:56px}
.tl::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--dw) + var(--rw)/2 - .5px);width:1px;background:var(--line-strong);opacity:.55}
h2.mo{width:max-content;margin:16px 0 8px calc(var(--dw) + var(--rw) + 4px);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);position:relative;box-shadow:var(--sh)}
.it{display:grid;grid-template-columns:var(--dw) var(--rw) 1fr;align-items:start;position:relative}
.it .dt{margin-top:6px;padding:9px 0 8px;border-radius:14px;text-align:center;line-height:1}
.it .dt b{display:block;font-size:18px;font-weight:700}
.it .dt span{display:block;font-size:11px;color:var(--text-2);margin-top:4px;font-weight:500}
.it .dot{position:relative;height:100%}
.it .dot::after{content:"";position:absolute;left:50%;top:25px;width:10px;height:10px;transform:translateX(-50%);border-radius:999px;background:var(--surface);border:2px solid var(--text-3)}
.it.won .dot::after{background:var(--win);border-color:var(--win)}
.it.lost .dot::after{background:var(--loss);border-color:var(--loss)}
.it.past .dot::after{background:var(--text-3);border-color:var(--text-3)}
.it.won .dot::after{background:var(--win);border-color:var(--win)}
.it.lost .dot::after{background:var(--loss);border-color:var(--loss)}
.it.next .dot::after{width:14px;height:14px;top:23px;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-chip)}
.it .bd{display:flex;align-items:flex-start;gap:8px;margin:6px 0;padding:12px 12px 12px 14px;border-radius:18px;min-width:0}
.it .mid{flex:1;min-width:0}
.it .opp{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.it.past .opp{font-weight:500;color:var(--text-2)}
.it .meta{display:inline-flex;align-items:flex-start;gap:4px;margin-top:2px;padding:2px 0;font-size:14px;line-height:1.4;color:var(--text-2);text-decoration:none}
.it .meta .go{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.it.next .go{display:none}
.it a.meta:hover{color:var(--text);text-decoration:underline}
.it .meta svg{flex:none;width:14px;height:14px;margin-top:2px}
.vs{font-weight:500;color:var(--text-2)}
.it .end{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.it .time{font-size:15px;font-weight:600;line-height:22px}
.it .time.tbc{font-size:13px;font-weight:500;color:var(--text-2)}
.it .score{font-size:17px;font-weight:700;line-height:22px}
.it .score.sm{font-size:13px;font-weight:600;line-height:18px;color:var(--text-3)}
.it.won .score{color:var(--win)}.it.lost .score{color:var(--loss)}
.rowtools{display:flex;gap:6px}
.ic{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;color:var(--text-2);background:var(--glass-strong);border:1px solid var(--edge);box-shadow:0 1px 2px rgba(15,23,42,.12);transition:color .15s,transform .15s}
.ic:hover{color:var(--text)}.ic:active{transform:scale(.94)}
.ic svg{width:18px;height:18px}

/* home / away */
.lg{display:inline-flex;align-items:center;height:22px;margin:0 0 6px 6px;padding:0 7px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text-2);border:1px solid var(--hair);vertical-align:top}
.side{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:7px;font-size:12px;font-weight:600;line-height:1;margin-bottom:6px}
.side svg{width:12px;height:12px}
.side.home{background:var(--club);color:#fff;box-shadow:0 6px 12px -6px rgba(37,99,235,.7)}
.side.away{border:1.5px solid var(--text-2);color:var(--text);padding:0 7px 0 5px;background:var(--glass-strong)}

/* next game */
.it.next .bd{display:block;margin:8px 0 10px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--next-a),var(--next-b));border:1px solid var(--accent-line);box-shadow:var(--sh-lift);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.it.next .dt b{color:var(--accent-text)}
.it.next .k{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.it.next .side{height:28px;padding:0 12px 0 10px;font-size:14px;margin:0;gap:6px;border-radius:9px}
.it.next .side svg{width:16px;height:16px}
.it.next .side.away{padding:0 11px 0 9px}
.chip{font-size:12px;font-weight:600;line-height:1;padding:7px 11px;border-radius:999px;background:var(--accent-chip);color:var(--accent-text)}
.it.next .opp{font-size:24px;line-height:1.2;letter-spacing:-.02em}
.it.next .when{font-size:16px;font-weight:500;margin-top:8px}
.it.next .where{margin-top:4px}
.it.next .where .meta{margin-top:0}
.it.next .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.it.next .acts .ic{margin-left:auto}
.cta,.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.cta{padding:0 18px;background:linear-gradient(180deg,#E2570F,#B93C0B);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 20px -10px rgba(234,88,12,.85);transition:filter .15s}
.cta:hover{filter:brightness(.94)}
.pill{background:var(--glass-strong);border:1px solid var(--edge);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.cta svg,.pill svg{width:16px;height:16px}
.endnote{padding:16px 0 4px calc(var(--dw) + var(--rw) + 4px);font-size:14px;color:var(--text-2)}
.brand{width:max-content;margin:22px auto 4px;padding:6px 14px;border-radius:999px;text-align:center;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--text-2)}

/* jump pill */
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:999px;color:var(--accent-text);font-size:14px;font-weight:600}
.jump svg{width:16px;height:16px;transition:transform .15s}
.jump[data-dir="up"] svg{transform:rotate(180deg)}

/* quote footer */
.quote{display:flex;align-items:center;gap:10px;margin:8px 16px 12px;padding:10px 14px;border-radius:16px;text-align:left;width:calc(100% - 32px);color:var(--text)}
.quote.glass{background:var(--glass-soft);border:1px solid color-mix(in srgb,var(--text) 6%,transparent);box-shadow:none}
.quote .qmark{flex:none;align-self:flex-start;font-size:22px;line-height:20px;font-weight:600;color:var(--text-3)}
.quote .qbody{flex:1;min-width:0;font-size:13px;line-height:1.4;font-weight:400;transition:opacity .17s,transform .17s}
.quote #q-by{display:block;font-size:11.5px;line-height:1.3;color:var(--text-2);margin-top:3px;letter-spacing:.01em}
.quote .qref{flex:none;width:16px;height:16px;color:var(--text-3);opacity:.75}
.quote.swap .qbody{opacity:0;transform:translateY(3px)}

/* empty, buttons, sheets */
.empty{margin:24px 0;padding:32px 24px;text-align:center;border-radius:20px;color:var(--text-2)}
.empty h2{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px}
.empty p{font-size:14px;margin-bottom:16px}
.btn{height:42px;padding:0 18px;border-radius:999px;background:linear-gradient(180deg,#E2570F,#B93C0B);color:#fff;font-size:14px;font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 20px -10px rgba(234,88,12,.85)}
.btn:hover{filter:brightness(.94)}
.btn.ghost{background:var(--glass-strong);color:var(--text-2);border:1px solid var(--edge);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--loss);box-shadow:none}
dialog{border:1px solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;padding:0;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);color:var(--text);width:100%;max-width:560px;
  margin:auto auto 0;max-height:88dvh;box-shadow:0 -20px 60px rgba(2,6,23,.35)}
dialog::backdrop{background:rgba(2,6,23,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.note{font-size:14px;color:var(--text-2);margin:0 0 16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:4px}
.field input,.field textarea{width:100%;background:var(--field);border:1px solid var(--hair);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--text)}
.field textarea{min-height:200px;font-size:14px;line-height:1.5}
.two{display:flex;gap:12px}.two>*{flex:1;min-width:0}
.sheetacts{display:flex;gap:8px;margin-top:16px;align-items:center}
.sheetacts .sp{flex:1}
.menu{display:flex;flex-direction:column;margin:-4px 0 0}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border-top:1px solid var(--hair);padding:16px 0;font-size:16px;font-weight:500;min-height:56px;width:100%}
.menu button:first-child{border-top:0}
.menu a.calopt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border-top:1px solid var(--hair);padding:16px 0;font-size:16px;font-weight:500;min-height:56px;color:inherit;text-decoration:none}
.menu a.calopt:first-child{border-top:0}
.menu a.calopt small{display:block;font-size:14px;font-weight:400;color:var(--text-2)}
.menu a.calopt svg{width:16px;height:16px;color:var(--text-3);flex:none}
.menu button small{display:block;font-size:14px;font-weight:400;color:var(--text-2)}
.menu button svg{width:16px;height:16px;color:var(--text-3);flex:none}
.preview{max-height:38dvh;overflow:auto;border:1px solid var(--hair);border-radius:12px;padding:8px 12px;font-size:14px;background:var(--field)}
.preview div{padding:4px 0;border-bottom:1px solid var(--hair)}
.preview div:last-child{border:0}
.preview .bad{color:var(--loss)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg-top);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:99;box-shadow:0 10px 24px -8px rgba(2,6,23,.5)}
.hide{display:none!important}
.rfb.spin svg{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fbar{display:flex;align-items:center;gap:8px;margin:0 16px 8px}
.seg{flex:1;display:flex;padding:3px;border-radius:14px;gap:2px;height:42px;box-sizing:border-box}
.seg button{flex:1;height:36px;border-radius:11px;font-size:14px;font-weight:600;color:var(--text-2)}
.seg button[aria-checked="true"]{background:linear-gradient(180deg,#F97316,#C2410C);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 12px -6px rgba(234,88,12,.7)}
.side,.chip{white-space:nowrap}

/* ===== design v7: sunset hoop photo (assets/bg-sunset.png), clear glass cards, teal + coral accents ===== */
:root{--gloss:rgba(255,255,255,.16);--gloss-low:rgba(255,255,255,0);--rim:rgba(255,255,255,.38);--rim-b:rgba(0,0,0,.18)}

html{background:#0A1A24}

/* clear glass cards: low fill, strong blur, bright rim */
.glass{-webkit-backdrop-filter:blur(16px) saturate(165%);backdrop-filter:blur(16px) saturate(165%)}

.chip{background:var(--accent-chip);color:var(--text)}
/* home = teal, away = outline */
.side.home{background:linear-gradient(135deg,#1FC2D3,#1588B5);color:#fff;box-shadow:0 6px 12px -6px rgba(21,136,181,.7)}
/* buttons: sunset gradient */
:root[data-theme] .cta,:root[data-theme] .btn{background:linear-gradient(135deg,#FF9A5A 0%,#FF5C85 100%);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 12px 24px -10px rgba(255,92,133,.8)}

.pip.w{background:#22C55E}.pip.l{background:#F43F5E}

:root[data-theme="light"] .quote .qbody{color:#173B48}:root[data-theme="light"] .quote #q-by{color:#2E5866}
/* full-height layout driven by the real visible height (set from script) */
body{position:fixed;top:0;right:0;bottom:0;left:0;height:auto}
.app{height:100%;padding-bottom:max(env(safe-area-inset-bottom,0px),10px)}
/* quote: a faint frosted layer, clearly separate from the footnote below */
.quote.glass{background:var(--glass-soft);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0;box-shadow:none;border-radius:14px;margin:4px 16px 10px;padding:9px 14px;width:calc(100% - 32px)}

/* next game */

/* ===== document scrolling: the page scrolls, the top block stays, browser toolbars can collapse ===== */
html{height:auto}
body{position:static;height:auto;min-height:100%;overflow:visible}
#root{height:auto}
.app{height:auto;min-height:100vh;min-height:100dvh;padding:0 0 max(env(safe-area-inset-bottom,0px),12px);display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:6;padding-top:env(safe-area-inset-top,0px);padding-bottom:2px;-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
:root[data-theme="dark"] .top{background:linear-gradient(180deg,rgba(8,8,10,.86),rgba(8,8,10,.70))}
:root[data-theme="light"] .top{background:linear-gradient(180deg,rgba(246,246,248,.88),rgba(246,246,248,.72))}
.scroller{position:static;overflow:visible;flex:1;padding:2px 16px 0}
.jump{position:fixed;bottom:auto;top:calc(var(--top-h,200px) + 10px)}
.bottom{margin-top:auto;padding-top:6px}

/* ===== bottom bar stays put; scroll animations ===== */
.app{padding-bottom:calc(var(--bot-h,150px) + 14px)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;max-width:560px;margin:0 auto;padding:10px 0 max(env(safe-area-inset-bottom,0px),8px)}
:root[data-theme="dark"] .bottom{background:linear-gradient(180deg,rgba(6,6,8,0),rgba(6,6,8,.62) 38%,rgba(6,6,8,.78))}
:root[data-theme="light"] .bottom{background:linear-gradient(180deg,rgba(244,244,246,0),rgba(244,244,246,.70) 38%,rgba(244,244,246,.86))}
.bottom .quote.glass{margin:0 16px 6px;width:calc(100% - 32px)}
.bottom .foot{margin:0 16px}
.top{transition:box-shadow .25s ease}
.top.scrolled{box-shadow:0 14px 28px -18px rgba(0,0,0,.65)}
.bg .photo{will-change:transform;transform:scale(1.08)}
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0;transform:translateY(22px) scale(.985);transition:opacity .55s ease,transform .6s cubic-bezier(.2,.75,.25,1)}
  .rv.in{opacity:1;transform:none}
  .it.next.rv{transform:translateY(26px) scale(.97)}
  .it.next.rv.in{transform:none}
}
@media (prefers-reduced-motion:reduce){.bg .photo{transform:scale(1.08)!important}}

.rfb{width:42px;height:42px;margin:-10px -4px -10px 0;color:var(--text)}

    });
  }, {threshold:0.08, rootMargin:"0px 0px -6% 0px"});
  els.forEach(function(e){ e.classList.add("rv"); io.observe(e); });
}
var ticking = false;
function onScrollFx(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(function(){
    ticking = false;
    var y = window.scrollY || 0, ph = document.querySelector(".bg .photo"), top = $("#top");
    if (ph) ph.style.transform = "translate3d(0," + Math.round(-Math.min(y, 1600) * 0.06) + "px,0) scale(1.08)";
    if (top) top.classList.toggle("scrolled", y > 6);
  });
}
window.addEventListener("scroll", onScrollFx, {passive:true});

/* the page itself scrolls (not an inner box), so browsers can hide their toolbars and use the whole screen */
function botHeight(){
  var b = $("#bottom"), h = b ? b.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty("--bot-h", Math.round(h) + "px");
  return h;
}
function topHeight(){ var t = $("#top"), h = t ? t.getBoundingClientRect().height : 0; document.documentElement.style.setProperty("--top-h", Math.round(h) + "px"); return h; }

function centerFocus(smooth){
  var el = $("#focus"), sp = $("#spacer");
  if (!el) return;
  if (sp) sp.style.height = "0px";
  var topH = topHeight(), botH = botHeight(), vis = window.innerHeight - topH - botH;
  var elTop = el.getBoundingClientRect().top + window.scrollY, h = el.offsetHeight;
  var need = Math.max(0, (vis - h) / 2);
  var target = Math.max(0, elTop - topH - need);
  var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  if (sp && target > maxScroll) sp.style.height = Math.ceil(target - maxScroll) + "px";
  var reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  window.scrollTo({top:target, behavior:(smooth && !reduce) ? "smooth" : "auto"});
  updateJump();
}

function updateJump(){
  var el = $("#focus"), pill = $("#jump");
  if (!pill) return;
  if (!el) { pill.classList.add("hide"); return; }
  var r = el.getBoundingClientRect(), topH = topHeight();
  var above = r.bottom < topH + 8, below = r.top > window.innerHeight - botHeight() - 8;
  pill.classList.toggle("hide", !(above || below));
  pill.setAttribute("data-dir", above ? "up" : "down");
}
window.addEventListener("scroll", updateJump, {passive:true});
/* tap the right side of a step card for the next step, the left third for the previous one (like stories) */
document.addEventListener("click", function(ev){
  var card = ev.target.closest ? ev.target.closest(".slide") : null;
  if (!card) return;
  var sl = card.parentNode, n = sl.children.length, r = card.getBoundingClientRect();
  var i = Math.round(sl.scrollLeft / Math.max(1, sl.clientWidth));
  var to = ev.clientX - r.left < r.width / 3 ? i - 1 : i + 1;
  if (to < 0 || to >= n) return;
  sl.scrollTo({left: to * sl.clientWidth, behavior: "smooth"});
});
document.addEventListener("scroll", function(ev){
  var sl = ev.target;
  if (!sl || sl.id !== "slides") return;
  var i = Math.round(sl.scrollLeft / Math.max(1, sl.clientWidth));
  if (i === pbFrame) return;
  pbFrame = i;
  sl.parentNode.querySelectorAll(".dots button").forEach(function(b, k){ b.setAttribute("aria-selected", k === i ? "true" : "false"); });
}, true);
window.addEventListener("resize", function(){ topHeight(); botHeight(); });

/* ---------- sheets ---------- */

function sheet(html){
  var d = document.createElement("dialog");
  d.innerHTML = '<div class="sheet">' + html + '</div>';
  document.body.appendChild(d);
  d.addEventListener("close", function(){ d.remove(); });
  d.addEventListener("click", function(ev){ if (ev.target === d) d.close(); });
  d.showModal();
  return d;
}
function toast(msg){
  var t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

/* ---------- calendar export ---------- */

/* Tip-off times are Cyprus local time (EET, +2; EEST, +3 from the last Sunday of March to the last Sunday of October). */
function lastSunday(y, m){ var d = new Date(Date.UTC(y, m + 1, 0, 1)); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d; }
function cyprusUTC(g){
  var p = g.date.split("-").map(Number), t = (g.time || "12:00").split(":").map(Number);
  var asUTC = Date.UTC(p[0], p[1] - 1, p[2], t[0], t[1]);
  var dst = asUTC - 3*3600000 >= lastSunday(p[0], 2).getTime() && asUTC - 3*3600000 < lastSunday(p[0], 9).getTime();
  return new Date(asUTC - (dst ? 3 : 2) * 3600000);
}
function icsStamp(d){
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
}
function icsDate(g){ var p = g.date.split("-"); return p[0] + p[1] + p[2]; }
function nextDay(g){
  var p = g.date.split("-").map(Number), n = new Date(Date.UTC(p[0], p[1] - 1, p[2] + 1));
  return n.getUTCFullYear() + pad(n.getUTCMonth()+1) + pad(n.getUTCDate());
}
function gameTitle(g){ return (isHome(g) ? state.team + " vs " : state.team + " at ") + opponent(g); }
function icsEsc(t){ return String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function icsFor(games){
  var out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//" + state.team + " " + state.league + "//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  games.forEach(function(g){
    out.push("BEGIN:VEVENT","UID:" + g.id + "@apop-schedule","DTSTAMP:" + icsStamp(new Date()));
    if (g.time) {
      var s = cyprusUTC(g), e = new Date(s.getTime() + 90*60000);
      out.push("DTSTART:" + icsStamp(s), "DTEND:" + icsStamp(e));
    } else {
      out.push("DTSTART;VALUE=DATE:" + icsDate(g), "DTEND;VALUE=DATE:" + nextDay(g));
    }
    out.push("SUMMARY:" + icsEsc(gameTitle(g) + (g.time ? "" : " (time TBC)")),
      "LOCATION:" + icsEsc(g.venue || ""));
    if (mapsUrl(g)) out.push("DESCRIPTION:" + icsEsc("Directions: " + mapsUrl(g)));
    if (g.time) out.push("BEGIN:VALARM","TRIGGER:-PT90M","ACTION:DISPLAY","DESCRIPTION:Tip-off in 90 minutes","END:VALARM");
    out.push("END:VEVENT");
  });
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}
function icsHref(games){ return "data:text/calendar;charset=utf-8," + encodeURIComponent(icsFor(games)); }
function googleCalUrl(g){
  var dates = g.time ? icsStamp(cyprusUTC(g)) + "/" + icsStamp(new Date(cyprusUTC(g).getTime() + 90*60000)) : icsDate(g) + "/" + nextDay(g);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(gameTitle(g) + (g.time ? "" : " (time TBC)"))
    + "&dates=" + dates + "&location=" + encodeURIComponent(g.venue || "")
    + "&details=" + encodeURIComponent(mapsUrl(g) ? "Directions: " + mapsUrl(g) : "");
}
function calOption(href, title, sub, extra){
  return '<a class="calopt" href="' + esc(href) + '" ' + (extra || 'target="_blank" rel="noopener noreferrer"') + '><span>' + title + '<small>' + sub + '</small></span>' + ICON.chev + '</a>';
}
function calSheet(games, name){
  if (!games.length) { toast("No games to add yet"); return; }
  var single = games.length === 1, g = games[0];
  var d = sheet('<h2>' + (single ? "Add to calendar" : "Export all games") + '</h2>'
    + '<p class="note">' + (single ? esc(gameTitle(g)) + (g.time ? "" : " · time TBC, added as an all-day event") : "Every game in one calendar file.") + '</p>'
    + '<div class="menu">'
    + (single ? calOption(googleCalUrl(g), "Google Calendar", "Opens Google Calendar to save the game") : "")
    + calOption(icsHref(games), single ? "Apple, Outlook or other" : "Download calendar file", "Saves a .ics file to open in your calendar app", 'download="' + esc(name) + '"')
    + '</div>');
  d.addEventListener("click", function(ev){ if (ev.target.closest && ev.target.closest("a.calopt")) setTimeout(function(){ d.close(); }, 300); });
}

/* ---------- share and updates ---------- */
function siteUrl(){ return location.origin + location.pathname.replace(/index\.html$/, ""); }
function seenUpdates(){ try { return localStorage.getItem("apop-seen-updates") === "1"; } catch (e) { return true; } }
function nextGameLine(){
  var g = sorted().filter(upcoming)[0];
  if (!g) return "";
  var d = when(g);
  return "Next: " + DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + (g.time ? " " + g.time : "") + " " + (isHome(g) ? "vs " : "at ") + opponent(g) + ". ";
}
function shareText(){ return "ΑΠΟΠ U14 & U16 fixtures. " + nextGameLine() + "Live schedule, calendar and updates: "; }
function waUrl(){ return "https://wa.me/?text=" + encodeURIComponent(shareText() + siteUrl()); }
function copyLink(){
  var url = siteUrl(), done = function(){ haptic("success"); toast("Link copied"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function(){ toast("Could not copy the link"); });
  else {
    var t = document.createElement("textarea"); t.value = url; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select();
    try { document.execCommand("copy") ? done() : toast("Could not copy the link"); } catch (e) { toast("Could not copy the link"); }
    t.remove();
  }
}

/* ---------- notifications (Web Push, inside the page) ---------- */
function pushCfg(){ var p = state.push || {}; return (typeof p.api === "string" && p.api.indexOf("https://") === 0 && p.publicKey) ? p : null; }
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function isStandalone(){ try { return navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches; } catch (e) { return false; } }
function pushStored(){ try { return JSON.parse(localStorage.getItem("apop-push") || "null"); } catch (e) { return null; } }
function leaguesNow(){ return filt === "both" ? LEAGUES.slice() : [filt]; }
function b64uBytes(str){
  var t = str.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "=";
  var raw = atob(t), out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushPost(path, body){
  return fetch(pushCfg().api.replace(/\/$/, "") + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
}
function pushOn(){                                   /* must start inside a tap */
  var cfg = pushCfg(), lg = leaguesNow();
  return Notification.requestPermission().then(function(perm){
    if (perm !== "granted") throw new Error("blocked");
    return navigator.serviceWorker.register("sw.js");
  }).then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(existing){
      return existing || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uBytes(cfg.publicKey)});
    }).then(function(sub){
      var j = sub.toJSON();
      return pushPost("/subscribe", {endpoint:j.endpoint, keys:j.keys, lg:lg}).then(function(r){
        if (!r.ok) throw new Error("server");
        try { localStorage.setItem("apop-push", JSON.stringify({lg:lg})); } catch (e) {}
        return reg.showNotification("Notifications are on", {body:"You will hear when a time, venue or result changes.", icon:"assets/icon-192.png", tag:"apop-welcome"});
      });
    });
  });
}
function pushOff(){
  return navigator.serviceWorker.getRegistration().then(function(reg){
    return reg ? reg.pushManager.getSubscription() : null;
  }).then(function(sub){
    if (!sub) return null;
    var e = sub.endpoint;
    return pushPost("/unsubscribe", {endpoint:e}).catch(function(){}).then(function(){ return sub.unsubscribe(); });
  }).then(function(){ try { localStorage.removeItem("apop-push"); } catch (e) {} });
}
function pushButtonHTML(){
  if (!pushCfg()) return "";
  var on = !!pushStored();
  return '<button class="lrow" data-x="pushtoggle" role="switch" aria-checked="' + on + '"><span class="ri bell">' + ICON.bell + '</span><span class="rl">Notifications</span><span class="iosw" aria-hidden="true"><i></i></span></button>';
}
function updatesSheet(){
  try { localStorage.setItem("apop-seen-updates", "1"); } catch (e) {}
  var base = siteUrl(), feed = filt === "U14" ? "apop-u14.ics" : filt === "U16" ? "apop-u16.ics" : "apop.ics";
  var webcal = base.replace(/^https?:/, "webcal:") + "calendar/" + feed;
  var d = sheet('<div class="grab" aria-hidden="true"></div><h2 class="big">Subscribe</h2><div class="grp">'
    + '<a class="lrow" href="' + esc(webcal) + '" target="_self"><span class="ri apple">' + ICON.apple + '</span><span class="rl">Apple Calendar</span>' + ICON.chev + '</a>'
    + '<a class="lrow" href="' + esc("https://calendar.google.com/calendar/r?cid=" + webcal) + '" target="_blank" rel="noopener noreferrer"><span class="ri google">' + ICON.gcal + '</span><span class="rl">Google Calendar</span>' + ICON.chev + '</a>'
    + pushButtonHTML() + '</div>');
  d.addEventListener("click", function(ev){
    var t = ev.target.closest ? ev.target : null, link = t && t.closest("a.lrow"), b = t && t.closest("[data-x]");
    if (link) { setTimeout(function(){ d.close(); render(); }, 300); return; }
    if (!b) return;
    if (pushStored()) {
      pushOff().then(function(){ d.close(); toast("Notifications are off"); render(); });
      return;
    }
    if (!pushSupported() || (isIOS() && !isStandalone())) {
      toast(isIOS() ? "On iPhone: Share → Add to Home Screen, then open the app icon" : "This browser can't show notifications");
      return;
    }
    if (Notification.permission === "denied") { toast("Notifications are blocked in your settings"); return; }
    b.disabled = true;
    pushOn().then(function(){ haptic("success"); d.close(); toast("Notifications are on"); render(); })
      .catch(function(e){ b.disabled = false; toast(e && e.message === "blocked" ? "Notifications were not allowed" : "Could not turn on notifications. Try again."); });
  });
  render();
}

function stamp(iso){
  var d = new Date(iso);
  return isNaN(d) ? "" : d.getDate() + " " + MONTHS[d.getMonth()] + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function updatedText(){
  var c = stamp(state.checked || state.updated);
  return c ? "Checked " + c : "Checked automatically";
}

/* ---------- haptic feedback ---------- */
var hapticEl = null;
function haptic(kind){
  try { if (navigator.vibrate) { navigator.vibrate(kind === "success" ? [10, 50, 14] : 8); return; } } catch (e) {}
  try {                                              /* iPhone (Safari 17.4+): toggling a native switch gives a tap */
    if (!hapticEl) {
      hapticEl = document.createElement("label");
      hapticEl.setAttribute("aria-hidden", "true");
      hapticEl.style.cssText = "position:fixed;left:-99px;top:-99px;width:1px;height:1px;opacity:0;pointer-events:none";
      var sw = document.createElement("input"); sw.type = "checkbox"; sw.setAttribute("switch", "");
      hapticEl.appendChild(sw); document.body.appendChild(hapticEl);
    }
    hapticEl.click();
    if (kind === "success") setTimeout(function(){ hapticEl.click(); }, 90);
  } catch (e) {}
}
document.addEventListener("click", function(ev){
  var t = ev.target && ev.target.closest ? ev.target.closest("button, a.calopt, a.rfb, a.lrow, [data-act]") : null;
  if (t && !t.disabled) haptic();
}, true);

/* ---------- events ---------- */

document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if (act === "jump") centerFocus(true);
  else if (act === "cal") {
    var cg = state.games.filter(function(x){ return x.id === id; })[0];
    if (cg) calSheet([cg], "apop-" + cg.date + ".ics");
  }
  else if (act === "filter") {
    filt = el.getAttribute("data-v");
    try { localStorage.setItem("apop-filter", filt); } catch (e) {}
    render({center:true});
  }
  else if (act === "view") { view = view === "table" ? "games" : "table"; render(); window.scrollTo(0, 0); if (view === "games") centerFocus(false); }
  else if (act === "playbook") { view = view === "play" ? "games" : "play"; render(); window.scrollTo(0, 0); if (view === "games") centerFocus(false); }
  else if (act === "pbplay") { pbPlay = Number(el.getAttribute("data-v")) || 0; pbFrame = 0; render(); }
  else if (act === "pbdot") { var sl = $("#slides"); if (sl) sl.scrollTo({left: Number(el.getAttribute("data-v")) * sl.clientWidth, behavior: "smooth"}); }
  else if (act === "copy") copyLink();
  else if (act === "updates") updatesSheet();
  else if (act === "refresh") {
    el.classList.add("spin");
    setTimeout(function(){ location.href = location.pathname + "?r=" + Date.now(); }, 350);
  }
  else if (act === "quote") { nextQuote(); paintQuote(true); }
  else if (act === "theme") {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("apop-theme", next); } catch (e) {}
    syncSwitch();
  }
});

try {
} catch (e) {}
try {
  var saved = localStorage.getItem("apop-theme");
  document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
} catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
try {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncSwitch);

document.body.insertAdjacentHTML("afterbegin", BG_HTML);
nextQuote();
render({center:true});

var lastSig = "";
setInterval(function(){
  if (document.querySelector("dialog[open]")) return;
  var n = sorted().filter(upcoming)[0], sig = n ? n.id + "|" + relative(cyprusUTC(n)) : "";

refreshData();
/* ?debug=1 shows the screen measurements (used to diagnose the iPhone home-screen layout) */
if (/[?&]debug=1/.test(location.search)) {
  var probe = document.createElement("div");
  probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden";

  document.body.appendChild(box);
  var paintDbg = function(){

      "\nscreen " + screen.height + "x" + screen.width + "  dpr " + devicePixelRatio +
      "\nsafe top " + cs.paddingTop + "  bottom " + cs.paddingBottom +
      "\nstandalone " + (navigator.standalone === true) + "  display-mode " + (matchMedia("(display-mode: standalone)").matches ? "standalone" : "browser") +
      "\nbody " + Math.round(document.body.getBoundingClientRect().height) + "  app " + Math.round(document.querySelector(".app").getBoundingClientRect().height) + "  bg " + Math.round(document.querySelector(".bg").getBoundingClientRect().height);
  };
  paintDbg(); setInterval(paintDbg, 1000);
}
var hiddenAt = 0;
document.addEventListener("visibilitychange", function(){
  if (document.hidden) { hiddenAt = Date.now(); return; }
  refreshData();
  if (hiddenAt && Date.now() - hiddenAt > 30000) render({center:true});   // coming back to the app: start on the next game again
});
window.addEventListener("pageshow", function(e){ if (e.persisted) render({center:true}); });
window.addEventListener("load", function(){ centerFocus(false); });
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ centerFocus(false); }); } catch (e) {}

})();
